# Kusari GitHub Actions Reusable Workflow
#
# This workflow provides automated security scanning for pull requests using Kusari Inspector.
# It automatically posts scan results as comments on pull requests when issues are found.
#
# USAGE:
#   Create a workflow file in your repository (e.g., .github/workflows/kusari-scan.yml):
#
#   name: Kusari Security Scan
#   on:
#     pull_request:
#       branches: [main, master]
#
#   jobs:
#     kusari-scan:
#       uses: kusaridev/kusari-ci-templates/.github/workflows/kusari-scan-v1.yml@v1
#       permissions:
#         contents: read
#         pull-requests: write
#       secrets:
#         KUSARI_CLIENT_ID: ${{ secrets.KUSARI_CLIENT_ID }}
#         KUSARI_CLIENT_SECRET: ${{ secrets.KUSARI_CLIENT_SECRET }}
#       with:
#         fail_on_issues: false
#         post_comment: true
#
# REQUIRED SECRETS (set in GitHub repository/organization settings):
#   - KUSARI_CLIENT_ID: Your Kusari client ID
#   - KUSARI_CLIENT_SECRET: Your Kusari client secret
#
# REQUIRED PERMISSIONS:
#   The calling workflow MUST specify these permissions:
#     permissions:
#       contents: read        # Required to checkout code
#       pull-requests: write  # Required to post PR comments
#
# OPTIONAL INPUTS:
#   - kusari_cli_image: Override the default Kusari CLI image
#   - fail_on_issues: Set to true to fail workflow on security issues (default: false)
#   - post_comment: Set to true to post results as PR comment (default: true)

name: Kusari Security Scan

on:
  workflow_call:
    inputs:
      kusari_cli_image:
        description: 'Kusari CLI container image'
        required: false
        type: string
        default: 'ghcr.io/kusaridev/kusari-cli@sha256:541e1872cc3ba7fae9adb797d1865473e812b353c3521e2ebcae9cfe3444bf55'
      fail_on_issues:
        description: 'Fail workflow if security issues are found'
        required: false
        type: boolean
        default: false
      post_comment:
        description: 'Post scan results as PR comment'
        required: false
        type: boolean
        default: true
    secrets:
      KUSARI_CLIENT_ID:
        description: 'Kusari client ID'
        required: true
      KUSARI_CLIENT_SECRET:
        description: 'Kusari client secret'
        required: true

jobs:
  kusari-scan:
    name: Kusari Security Scan
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.kusari_cli_image }}

    steps:
      # git (required by the CLI) and jq (used below) are installed here because
      # the CLI image does not ship them.
      #
      # This step verifies rather than assumes. The image is digest-pinned but
      # apk serves a rolling repository, so a package can install cleanly and
      # then fail on every invocation -- which is exactly what happened when the
      # repository's jq moved to a build needing GLIBC_2.44 while pinned images
      # were frozen at glibc 2.43:
      #   jq: /usr/lib/libm.so.6: version `GLIBC_2.44' not found
      #
      # So: install what is missing, then prove it runs, and fall back to a build
      # known to work on older images if it does not. A hard failure here beats a
      # green pipeline whose scan output was never readable.
      - name: Ensure dependencies
        run: |
          need=""
          git --version >/dev/null 2>&1 || need="$need git"
          jq --version  >/dev/null 2>&1 || need="$need jq"
          if [ -n "$need" ]; then
            echo "Installing:$need"
            # shellcheck disable=SC2086
            apk add --no-cache $need
          fi

          # jq 1.8.1 links against glibc 2.43 and runs on images that predate the
          # 2.44 rebuild. Newer images resolve a working jq above and skip this.
          if ! jq --version >/dev/null 2>&1; then
            echo "jq from the repository does not run in this image; falling back to jq 1.8.1"
            apk add --no-cache "jq=1.8.1-r0"
          fi

          git --version >/dev/null 2>&1 || { echo "::error::git is unusable in this image"; exit 1; }
          jq  --version >/dev/null 2>&1 || { echo "::error::jq is unusable in this image"; exit 1; }
          echo "git $(git --version | awk '{print $3}') and $(jq --version) are usable"

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true   # Required for git fetch

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF"

      - name: Authenticate with Kusari
        run: kusari auth login --client-id="${{ secrets.KUSARI_CLIENT_ID }}" --client-secret="${{ secrets.KUSARI_CLIENT_SECRET }}"

      - name: Run Kusari scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POST_COMMENT: ${{ inputs.post_comment }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          GITHUB_COMMENT_FLAG=""
          if [ "$POST_COMMENT" = "true" ]; then
            GITHUB_COMMENT_FLAG="--comment github"
          fi
          # CI checks out a detached HEAD, so override the reported branch with the PR's source branch
          kusari repo scan -w --output-format sarif --override-branch "$HEAD_REF" $GITHUB_COMMENT_FLAG . "origin/$BASE_REF" > kusari_results.sarif

      # Rendering results is cosmetic, so it must never fail the job: the scan has
      # already run and the verdict is checked in the next step. This step used to
      # be able to kill a successful scan before the gate was ever reached.
      - name: Display scan results
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "KUSARI SECURITY SCAN RESULTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          # No `//` default here. It substitutes on null AND false, so it is only
          # safe on values that can never be false; using it uniformly is what hid
          # the should_proceed bug below.
          COMMENT_BODY=$(jq -r '.runs[0].results[0].message.markdown' kusari_results.sarif)
          if [ -z "$COMMENT_BODY" ] || [ "$COMMENT_BODY" = "null" ]; then
            COMMENT_BODY="No results found"
          fi
          echo "$COMMENT_BODY"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # should_proceed is a JSON boolean. `// "true"` substitutes its default when
      # the left side is null OR false, so it returned "true" precisely when the
      # value was false -- fail_on_issues could never fail a workflow. Compare
      # explicitly instead.
      - name: Check for security issues
        if: inputs.fail_on_issues
        run: |
          if [ ! -s kusari_results.sarif ]; then
            echo "No SARIF results to evaluate - failing closed"
            exit 1
          fi
          if jq -e '[.runs[]?.results[]?.properties.should_proceed]
                    | any(. == false or . == "false")' kusari_results.sarif > /dev/null; then
            echo "Security issues found - failing workflow"
            exit 1
          fi
          echo "No blocking issues found"

      - name: Upload SARIF results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        if: always()
        with:
          name: kusari-sarif-results
          path: kusari_results.sarif
          retention-days: 30
