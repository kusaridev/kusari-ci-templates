# Kusari GitLab CI/CD Template
#
# This template provides automated security scanning for merge requests using Kusari Inspector.
# It automatically posts scan results as comments on merge requests when issues are found.
#
# PUBLIC GITLAB.COM USAGE:
#   include:
#     - remote: 'https://raw.githubusercontent.com/kusaridev/kusari-cli/v0.17.9/ci-templates/gitlab/kusari-scan.yml'
#
# ENTERPRISE/SELF-HOSTED GITLAB USAGE:
#   1. Mirror ghcr.io/kusaridev/kusari-cli to your internal container registry
#   2. Copy this file to your internal GitLab instance (e.g., gitlab.corp.com/platform/ci-templates)
#   3. Update KUSARI_CLI_IMAGE variable to point to your internal registry
#   4. Include in your projects:
#
#   include:
#     - project: 'platform/ci-templates'
#       ref: 'main'
#       file: '/gitlab/kusari-scan.yml'
#
# REQUIRED CI/CD VARIABLES (set in GitLab project/group settings):
#   - KUSARI_CLIENT_ID: Your Kusari client ID
#   - KUSARI_CLIENT_SECRET: Your Kusari client secret (mark as masked)
#
# REQUIRED FOR MR COMMENTS (choose one option):
#   Option A - Use a GitLab Token (Recommended):
#     1. Create a Project Access Token or Personal Access Token with 'api' scope
#        (Settings > Access Tokens > Add new token > Select 'api' scope)
#     2. Add the token as a CI/CD variable named GITLAB_TOKEN (mark as masked)
#        (Settings > CI/CD > Variables > Add variable)
#
#   Option B - Enable CI_JOB_TOKEN API Access:
#     1. Go to Settings > CI/CD > Token Access
#     2. Enable "Allow CI job tokens from this project to access this project's API"
#     Note: This option has more limited permissions and may not work in all scenarios
#
# OPTIONAL VARIABLES:
#   - KUSARI_CLI_IMAGE: Override the default Kusari CLI image
#   - KUSARI_FAIL_ON_ISSUES: Set to "true" to fail pipeline on security issues (default: "false")
#   - KUSARI_POST_COMMENT: Set to "true" to post results as MR comment (default: "true")

variables:
  KUSARI_CLI_IMAGE: "ghcr.io/kusaridev/kusari-cli@sha256:e6f35fbf9b947b1d61c97858ee4539f0e935409afc24f348d3e7653401e69cc0"
  KUSARI_FAIL_ON_ISSUES: "false"
  KUSARI_POST_COMMENT: "true"

.kusari-scan:
  image:
    name: ${KUSARI_CLI_IMAGE}
    entrypoint: [""]
  stage: test
  # allow_failure is decided here, per rule, because the job-level keyword takes
  # precedence over rules -- a hardcoded `allow_failure: true` on the job makes
  # KUSARI_FAIL_ON_ISSUES unable to fail a pipeline no matter what the script
  # returns. Setting it in rules is what lets the flag actually mean something.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $KUSARI_FAIL_ON_ISSUES == "true"'
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true
  before_script:
    # git (required by the CLI) and jq (used below) are installed here because
    # the CLI image does not ship them.
    #
    # This verifies rather than assumes: the image is digest-pinned but apk
    # serves a rolling repository, so a package can install cleanly and then fail
    # on every call -- which is what happened when the repository's jq moved to a
    # build needing GLIBC_2.44 while pinned images were frozen at glibc 2.43.
    - |
      need=""
      git --version >/dev/null 2>&1 || need="$need git"
      jq --version  >/dev/null 2>&1 || need="$need jq"
      if [ -n "$need" ]; then
        echo "Installing:$need"
        apk add --no-cache $need
      fi

      # jq 1.8.1 links against glibc 2.43 and runs on images that predate the
      # 2.44 rebuild. Newer images resolve a working jq above and skip this.
      if ! jq --version >/dev/null 2>&1; then
        echo "jq from the repository does not run in this image; falling back to jq 1.8.1"
        apk add --no-cache "jq=1.8.1-r0"
      fi

      git --version >/dev/null 2>&1 || { echo "git is unusable in this image"; exit 1; }
      jq  --version >/dev/null 2>&1 || { echo "jq is unusable in this image"; exit 1; }
      echo "git $(git --version | awk '{print $3}') and $(jq --version) are usable"
  script:
    - git fetch origin ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
    - kusari auth login --client-id="${KUSARI_CLIENT_ID}" --client-secret="${KUSARI_CLIENT_SECRET}"
    # Run scan with GitLab comment posting (if enabled)
    # The --comment gitlab flag will post results directly to the MR if issues are found
    - |
      GITLAB_COMMENT_FLAG=""
      if [ "$KUSARI_POST_COMMENT" = "true" ]; then
        GITLAB_COMMENT_FLAG="--comment gitlab"
      fi
      # CI checks out a detached HEAD, so override the reported branch with the MR's source branch
      kusari repo scan -w --output-format sarif --override-branch "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" $GITLAB_COMMENT_FLAG . origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME} > kusari_results.sarif
    - |
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "KUSARI SECURITY SCAN RESULTS"
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo ""
      # No `//` default: it substitutes on null AND false, so it is only ever safe
      # on a value that cannot be false. Using it uniformly is what hid the
      # should_proceed bug in the gate below.
      COMMENT_BODY=$(jq -r '.runs[0].results[0].message.markdown' kusari_results.sarif)
      if [ -z "$COMMENT_BODY" ] || [ "$COMMENT_BODY" = "null" ]; then
        COMMENT_BODY="No results found"
      fi
      echo "$COMMENT_BODY"
      echo ""
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - |
      # should_proceed is a JSON boolean, and `// "true"` substitutes its default
      # when the left side is null OR false -- so it returned "true" exactly when
      # the value was false, and KUSARI_FAIL_ON_ISSUES could never fail a
      # pipeline. Compare explicitly.
      if [ "$KUSARI_FAIL_ON_ISSUES" = "true" ]; then
        if [ ! -s kusari_results.sarif ]; then
          echo "No SARIF results to evaluate - failing closed"
          exit 1
        fi
        if jq -e '[.runs[]?.results[]?.properties.should_proceed]
                  | any(. == false or . == "false")' kusari_results.sarif > /dev/null; then
          echo "Security issues found - failing pipeline"
          exit 1
        fi
        echo "No blocking issues found"
      fi
  artifacts:
    reports:
      sast: kusari_results.sarif
    paths:
      - kusari_results.sarif
    expire_in: 30 days
    when: always

kusari-repo-scan:
  extends: .kusari-scan
  # No job-level allow_failure: it would override the rules above and silently
  # restore the behaviour where KUSARI_FAIL_ON_ISSUES cannot fail a pipeline.
